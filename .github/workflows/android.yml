name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Завантажуємо код
      - name: Checkout code
        uses: actions/checkout@v4

      # Крок 2: Встановлюємо JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Крок 3: Надаємо права на виконання gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Крок 4: Будуємо APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Крок 5: Завантажуємо APK як артефакт
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VISA-CENTER
          path: app/build/outputs/apk/debug/app-debug.apk
